      const contiene = p.alergenos.filter(a => a.propiedad === -1);
      const trazas = p.alergenos.filter(a => a.propiedad === 1);

      html += `<div class="section-box"><div class="section-title">&#9888;&#65039; Alergenos</div>`;

      if (contiene.length) {
        html += `<div class="al-group al-contiene">
          <div class="al-group-hdr"><span class="al-dot al-dot-r"></span> Contiene</div>
          <div class="al-items">${contiene.map(a => `<div class="al-item al-item-r"><span class="al-em">${allergenEmojis[a.codigo]||'&#9888;&#65039;'}</span><span class="al-name">${esc(a.nombre)}</span></div>`).join('')}</div>
        </div>`;
      }
      if (trazas.length) {
        html += `<div class="al-group al-trazas">
          <div class="al-group-hdr"><span class="al-dot al-dot-y"></span> Posibles trazas</div>
          <div class="al-items">${trazas.map(a => `<div class="al-item al-item-y"><span class="al-em">${allergenEmojis[a.codigo]||'&#9888;&#65039;'}</span><span class="al-name">${esc(a.nombre)}</span></div>`).join('')}</div>
        </div>`;
      }
      if (false) {
        html += `<div class="al-group al-libre">
          <div class="al-group-hdr"><span class="al-dot al-dot-g"></span> No contiene</div>
          <div class="al-items"></div>
        </div>`;
      }
      html += `</div>`;
    }

    body.innerHTML = html;

    // Load escandallo asynchronously and append when ready
    loadEscandallo(cod, body, p);

  } catch (e) {
    body.innerHTML = `<span class="modal-close" onclick="closeModal()">&#10005;</span><div style="color:var(--red);padding:20px;">${esc(e.message)}</div>`;
  }
}

// ─── ESCANDALLO HELPERS ────────────────────────────────────────────

function isUnitProduct(cat, desc) {
  if (!cat && !desc) return false;
  const unitCats = ['Capsulas'];
  if (unitCats.includes(cat)) return true;
  const d = (desc || '').toLowerCase();
  return /\bcaps\b|c[aá]psul|comprimid|tableta|pastilla|softgel|gummie/.test(d);
}

const escCache = new Map();

async function toggleCardEsc(cod, safeId, cat, desc) {
  const container = document.getElementById(`esci-${safeId}`);
  const btn = document.getElementById(`ptog-${safeId}`);
  if (!container) return;

  const isOpen = container.style.display !== 'none';
  if (isOpen) {
    container.style.display = 'none';
    if (btn) { btn.innerHTML = '&#9654;'; btn.classList.remove('open'); }
    return;
  }
  container.style.display = 'block';
  if (btn) { btn.innerHTML = '&#9660;'; btn.classList.add('open'); }

  if (escCache.has(cod)) {
    renderEscInline(container, escCache.get(cod), cat, desc, cod, safeId);
    return;
  }

  container.innerHTML = `<div class="esc-loading">&#9881;&#65039; Cargando escandallo...</div>`;
  try {
    const data = await fetch(`${API}/api/product/${encodeURIComponent(cod)}/escandallo`).then(r => r.json());
    escCache.set(cod, data);
    renderEscInline(container, data, cat, desc, cod, safeId);
  } catch(e) {
    container.innerHTML = `<div style="font-size:9px;color:var(--red);padding:4px;">Error: ${esc(e.message)}</div>`;
  }
}

function renderEscInline(container, data, cat, desc, cod, safeId) {
  if (data.error || !data.componentes?.length) {
    container.innerHTML = `<div style="font-size:9px;color:var(--text3);padding:4px;">Sin datos de escandallo</div>`;
    return;
  }

  const fmtP = v => v != null ? `${v.toFixed(3)} €` : '—';
  const fmtPct = v => v != null ? `${v.toFixed(1)}%` : '—';
  const fmtU = v => v != null ? v.toFixed(3) : '—';

  // Split into Materias Primas / Material Auxiliar
  const mpList = [...data.componentes].filter(c => c.tipo_componente !== 'material_auxiliar')
    .sort((a, b) => (b.pct_coste || 0) - (a.pct_coste || 0));
  const maList = [...data.componentes].filter(c => c.tipo_componente === 'material_auxiliar')
    .sort((a, b) => (b.pct_coste || 0) - (a.pct_coste || 0));

  const renderInlineRows = (list, maxPct) => list.map(c => {
    const isTop = c.pct_coste != null && c.pct_coste === maxPct && maxPct > 0;
    const isInactivo = !!c.inactivo;
    const bCls = c.precio_fuente === 'reposicion' ? 'esc-badge-escalado' :
                 c.precio_fuente === 'ultima_compra' ? 'esc-badge-ultima' :
                 c.precio_fuente === 'cambio_codigo' ? 'esc-badge-cambio' :
                 c.precio_fuente === 'receta' ? 'esc-badge-receta' : 'esc-badge-pendiente';
    const bLbl = c.precio_fuente === 'reposicion' ? 'Rep' :
                 c.precio_fuente === 'ultima_compra' ? 'UC' :
                 c.precio_fuente === 'cambio_codigo' ? 'CC' :
                 c.precio_fuente === 'receta' ? 'Rec' : '?';
    const precioCell = c.precio_efectivo != null
      ? `${fmtP(c.precio_efectivo)} <span class="${bCls}">${bLbl}</span>`
      : `<span class="${bCls}">Pendiente de añadir precio</span>`;
    const pctBar = c.pct_coste != null
      ? `<span class="esc-pbar${isTop ? ' top' : ''}" style="width:${Math.min(Math.round(c.pct_coste * 0.8), 60)}px"></span>`
      : '';
    const udsLabel = c.es_formato_solido
      ? `${Math.round(c.UnidadesNecesarias).toLocaleString()} <span style="color:var(--text3);font-size:8px">uds</span>`
      : fmtU(c.UnidadesNecesarias);
    const rowStyle = isInactivo ? 'opacity:0.35;' : '';
    return `<tr class="${isTop ? 'esc-top' : ''}" style="${rowStyle}">
      <td><span style="font-size:8px;color:var(--text3);font-family:var(--mono)">${esc(c.ArticuloComponente)}</span> ${esc(c.DescripcionArticulo || '—')}${isInactivo ? ' <span style="font-size:7px;color:var(--text3)">(inactivo)</span>' : ''}${isTop ? ' <span style="color:var(--orange);font-size:9px">&#9888;</span>' : ''}</td>
      <td class="r">${udsLabel}</td>
      <td class="r">${precioCell}</td>
      <td class="r">${fmtPct(c.pct_coste)}${pctBar}</td>
    </tr>`;
  }).join('');

  const inlineSectionHdr = (label, color) =>
    `<tr><td colspan="4" style="background:${color};color:#fff;font-size:8px;font-weight:700;padding:2px 5px;">${label}</td></tr>`;

  let rows = '';
  if (mpList.length) {
    rows += inlineSectionHdr('🌾 MATERIAS PRIMAS', '#7c5c2e');
    rows += renderInlineRows(mpList, mpList[0]?.pct_coste || 0);
  }
  if (maList.length) {
    rows += inlineSectionHdr('🔧 MATERIAL AUXILIAR', '#374151');
    rows += renderInlineRows(maList, maList[0]?.pct_coste || 0);
  }

  const kgAmasijo    = data.kg_amasijo    != null ? Number(data.kg_amasijo)    : null;
  const costeAmasijo = data.coste_amasijo != null ? Number(data.coste_amasijo) : null;
  const costeAmasijoBobina = data.coste_amasijo_bobina != null ? Number(data.coste_amasijo_bobina) : null;
  const numUds       = data.numero_unidades  != null ? Number(data.numero_unidades)  : null;
  const costeUd      = data.coste_unitario   != null ? Number(data.coste_unitario)   : null;
  const costeParaMotor = costeAmasijo;
  const costeInputId = `calc-coste-i${safeId}`;
  const costeLabel = 'Coste Amasijo (€)';
  const costeInputHtml = costeParaMotor != null
    ? `<input type="number" id="${costeInputId}" class="esc-coste-input"
             step="0.001" min="0.001" value="${costeParaMotor.toFixed(3)}"
             title="Editar para recalcular precio"
             onclick="event.stopPropagation()"
             onchange="event.stopPropagation();calcularPrecio('${cod.replace(/'/g,"\\'")}','i${safeId}')">`
    : `<span class="val hl">—</span>`;

  const footerHtml = `<div class="esc-inline-footer">
    <div class="esc-stat"><span class="lbl">Kg / Amasijo</span><span class="val">${kgAmasijo != null ? kgAmasijo.toFixed(3) : '—'}</span></div>
    <div class="esc-stat"><span class="lbl">${costeLabel}</span>${costeInputHtml}</div>
    ${costeAmasijoBobina != null
      ? `<div class="esc-stat"><span class="lbl">Coste Amasijo + Bobina</span><span class="val hl">${costeAmasijoBobina.toFixed(3)} €</span></div>`
      : ''}
    ${data.peso_unitario_pieza != null
      ? `${numUds != null ? `<div class="esc-stat"><span class="lbl">Nº Unidades</span><span class="val">${Math.round(numUds).toLocaleString()}</span></div>` : ''}
         ${costeUd != null ? `<div class="esc-stat"><span class="lbl">Coste / Ud.</span><span class="val hl">${costeUd.toFixed(3)} €</span></div>` : ''}`
      : ''}
  </div>`;

  const pendCount = data.componentes.filter(c => c.precio_fuente === 'pendiente').length;
  const calcResultHtml = costeParaMotor != null
    ? `<div id="calc-result-i${safeId}" class="calc-result" style="margin:4px 5px 2px;"></div>`
    : '';

  container.innerHTML = `
    <table class="esc-inline-table">
      <thead><tr>
        <th>Componente</th>
        <th class="r">Uds. nec.</th>
        <th class="r">Precio (€/kg)</th>
        <th class="r">% Coste</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    ${footerHtml}
    ${pendCount > 0 ? `<div style="font-size:8px;color:var(--red);margin-top:3px;padding:0 5px;">&#9888; ${pendCount} componente${pendCount>1?'s':''} sin precio escalado</div>` : ''}
    ${calcResultHtml}`;

  if (costeParaMotor != null && costeParaMotor > 0) {
    calcularPrecio(cod, 'i' + safeId);
  }
}

async function loadEscandallo(cod, body, prod) {
  const placeholder = document.createElement('div');
  placeholder.id = 'esc-section';
  placeholder.innerHTML = `<div class="section-box" style="opacity:0.5"><div class="section-title">&#9881;&#65039; Escandallo — cargando...</div></div>`;
  body.appendChild(placeholder);

  try {
    let data;
    if (escCache.has(cod)) {
      data = escCache.get(cod);
    } else {
      data = await fetch(`${API}/api/product/${encodeURIComponent(cod)}/escandallo`).then(r => r.json());
      escCache.set(cod, data);
    }
    const sec = document.getElementById('esc-section');
    if (!sec) return;

    if (data.error || !data.componentes || !data.componentes.length) {
      const msg = (data.error || !data.componentes) ? 'No disponible' : 'Sin componentes';
      const escDivId = cod.replace(/[^a-zA-Z0-9]/g, '_');
      sec.innerHTML = `
        <div class="section-box">
          <div class="section-title">&#9881;&#65039; Escandallo</div>
          <div style="font-size:11px;color:var(--text3)">${msg}</div>
        </div>
        <div class="calc-precio-box">
          <div class="section-title">&#128182; Calcular Precio</div>
          <div class="calc-precio-row">
            <label for="calc-coste-${escDivId}">Coste amasijo (€):</label>
            <input id="calc-coste-${escDivId}" type="number" step="0.01" min="0.01"
                   placeholder="ej: 250.00" />
            <button id="calc-btn-${escDivId}" class="btn-calc"
                    onclick="calcularPrecio('${esc(cod)}','${escDivId}')">Calcular</button>
          </div>
          <div id="calc-result-${escDivId}" class="calc-result"></div>
        </div>`;
      return;
    }

    const cat = prod?._category || '';
    const desc = prod?.DescripcionArticulo || '';
    // Sort by pct_coste DESC — most expensive ingredient first
    const totalCoste      = data.coste_amasijo || 0;
    const costeAmasijoBob = data.coste_amasijo_bobina != null ? Number(data.coste_amasijo_bobina) : null;
    const kgAmasijo       = data.kg_amasijo;
    const numUds          = data.numero_unidades;
    const costeUd         = data.coste_unitario;
    const costeParaMotor  = totalCoste || null;

    const fmtPrecio = v => v != null ? `${v.toFixed(3)} €` : '—';
    const fmtPct = v => v != null ? `${v.toFixed(1)}%` : '—';
    const fmtU = v => v != null ? v.toFixed(3) : '—';

    // Split into two groups, each sorted by pct_coste desc
    const materiasPrimas = [...data.componentes]
      .filter(c => c.tipo_componente !== 'material_auxiliar')
      .sort((a, b) => (b.pct_coste || 0) - (a.pct_coste || 0));
    const materialAuxiliar = [...data.componentes]
      .filter(c => c.tipo_componente === 'material_auxiliar')
      .sort((a, b) => (b.pct_coste || 0) - (a.pct_coste || 0));

    const renderRows = (list, maxPct) => list.map(c => {
      const isTop = c.pct_coste != null && c.pct_coste === maxPct && maxPct > 0;
      const isInactivo = !!c.inactivo;
      const badgeClass = c.precio_fuente === 'reposicion' ? 'esc-badge-escalado' :
                         c.precio_fuente === 'ultima_compra' ? 'esc-badge-ultima' :
                         c.precio_fuente === 'cambio_codigo' ? 'esc-badge-cambio' :
                         c.precio_fuente === 'receta' ? 'esc-badge-receta' : 'esc-badge-pendiente';
      const badgeLabel = c.precio_fuente === 'reposicion' ? 'Reposición' :
                         c.precio_fuente === 'ultima_compra' ? 'Últ. compra' :
                         c.precio_fuente === 'cambio_codigo' ? 'Cambio código' :
                         c.precio_fuente === 'receta' ? 'Receta' : 'Pendiente';
      const precioLabel = c.precio_fuente === 'pendiente'
        ? `<span class="${badgeClass}">Pendiente de añadir precio</span>`
        : `${fmtPrecio(c.precio_efectivo)} <span class="${badgeClass}">${badgeLabel}</span>`;
      const pctBar = c.pct_coste != null
        ? `<span class="esc-pct-bar" style="width:${Math.round(c.pct_coste)}px"></span>`
        : '';
      const udsCell = c.es_formato_solido
        ? `${Math.round(c.UnidadesNecesarias).toLocaleString()} <span style="color:var(--text3);font-size:8px">uds</span>`
        : fmtU(c.UnidadesNecesarias);
      const rowStyle = isInactivo ? 'opacity:0.35;' : '';
      return `<tr class="${isTop ? 'esc-row-top' : ''}" style="${rowStyle}">
        <td><span class="esc-orden">${c.Orden}</span></td>
        <td><span style="font-size:9px;color:var(--text3);font-family:var(--mono)">(${esc(c.ArticuloComponente)})</span> ${esc(c.DescripcionArticulo || '—')}${isTop ? ' <span style="color:var(--orange)">&#9888;</span>' : ''}${isInactivo ? ' <span style="font-size:7px;color:var(--text3)">(inactivo)</span>' : ''}</td>
        <td class="num">${udsCell}</td>
        <td class="num">${precioLabel}</td>
        <td class="num ${isTop ? 'esc-pct-top' : ''}">${fmtPct(c.pct_coste)}${pctBar}</td>
        <td class="num">${c.FechaUltimaCompra || '—'}</td>
      </tr>`;
    }).join('');

    const maxMP = materiasPrimas[0]?.pct_coste || 0;
    const maxMA = materialAuxiliar[0]?.pct_coste || 0;

    const sectionHeader = (label, color, count) =>
      `<tr><td colspan="6" style="background:${color};color:#fff;font-size:9px;font-weight:700;
        padding:3px 6px;letter-spacing:0.05em;">${label} <span style="opacity:0.7">(${count})</span></td></tr>`;

    let rows = '';
    if (materiasPrimas.length) {
      rows += sectionHeader('🌾 MATERIAS PRIMAS', '#7c5c2e', materiasPrimas.length);
      rows += renderRows(materiasPrimas, maxMP);
    }
    if (materialAuxiliar.length) {
      rows += sectionHeader('🔧 MATERIAL AUXILIAR', '#374151', materialAuxiliar.length);
      rows += renderRows(materialAuxiliar, maxMA);
    }

    const comps = data.componentes; // for pendiente count below

    const escDivId = cod.replace(/[^a-zA-Z0-9]/g, '_');

    // Footer: resumen amasijo → unidad
    const costeFullVal = totalCoste > 0 ? totalCoste : null;
    const costeLabelFull = 'Coste Amasijo (€)';
    const footerHtml = `<tr class="esc-total-row">
      <td colspan="2"></td>
      ${!esFormato ? `<td class="num" style="font-size:9px;color:var(--text2)">Kg / Amasijo<br><span style="font-size:12px;color:var(--text)">${kgAmasijo != null ? kgAmasijo.toFixed(3) : '—'}</span></td>` : `<td class="num" style="font-size:9px;color:var(--text2)">Uds / Lote<br><span style="font-size:12px;color:var(--text)">${data.unidades_calculo ? Math.round(data.unidades_calculo).toLocaleString() : '—'}</span></td>`}
      <td class="num" style="font-size:9px;color:var(--text2)">${costeLabelFull}<br>
        ${costeFullVal != null
          ? `<input type="number" id="calc-coste-${escDivId}" class="esc-coste-input esc-coste-input-full"
                    step="0.001" min="0.001" value="${costeFullVal.toFixed(3)}"
                    title="Editar para recalcular precio"
                    onclick="event.stopPropagation()"
                    onchange="event.stopPropagation();calcularPrecio('${esc(cod)}','${escDivId}')">`
          : '<span style="font-size:12px;color:var(--accent2)">—</span>'}
        ${!esFormato && costeAmasijoBob != null ? `<br><span style="font-size:8px;color:var(--text3)">+ Bobina:</span> <span style="font-size:11px;color:var(--accent2)">${costeAmasijoBob.toFixed(3)} €</span>` : ''}
      </td>
      ${numUds != null ? `<td class="num" style="font-size:9px;color:var(--text2)">Nº Unidades<br><span style="font-size:12px;color:var(--text)">${Math.round(numUds).toLocaleString()}</span></td>` : '<td></td>'}
      ${costeUd != null
        ? `<td class="num" style="font-size:9px;color:var(--text2)">Coste / Ud.<br><span style="font-size:13px;color:var(--accent2)">${costeUd.toFixed(3)} €</span></td>`
        : '<td></td>'}
    </tr>`;

    const pendienteCount = data.componentes.filter(c => c.precio_fuente === 'pendiente').length;
    const pendienteNote = pendienteCount > 0
      ? `<div style="font-size:9px;color:var(--red);margin-top:6px;">&#9888; ${pendienteCount} componente${pendienteCount>1?'s':''} sin precio escalado</div>`
      : '';

    sec.innerHTML = `<div class="section-box">
      <div class="section-title">&#9881;&#65039; Escandallo <span style="font-weight:400;color:var(--text3)">(${comps.length} componentes)</span></div>
      <div style="overflow-x:auto">
        <table class="esc-table">
          <thead><tr>
            <th style="width:36px">Ord.</th>
            <th>Componente</th>
            <th class="num">Uds. nec.</th>
            <th class="num">Precio (€/kg)</th>
            <th class="num">% Coste</th>
            <th class="num">Últ. compra</th>
          </tr></thead>
          <tbody>${rows}</tbody>
          <tfoot>${footerHtml}</tfoot>
        </table>
      </div>
      ${pendienteNote}
    </div>
    <div class="calc-precio-box">
      <div class="section-title">&#128182; Precio calculado</div>
      <div id="calc-result-${escDivId}" class="calc-result"></div>
    </div>`;

    if (costeParaMotor != null && costeParaMotor > 0) {
      calcularPrecio(cod, escDivId);
    }
  } catch (e) {
    const sec = document.getElementById('esc-section');
    if (sec) sec.innerHTML = '';
  }
}

// ─── MOTOR DE PRECIOS ────────────────────────────────────────────────────────

// Metadatos de cada nivel de la cascada de precios (mismo orden que el backend).
// `label`  — etiqueta larga para nota HTML
// `cls`    — clase CSS del badge (coherente con el escandallo)
// `short`  — etiqueta corta del badge (3 caracteres max)
// `txt`    — etiqueta para el tooltip de texto plano (inline)
const _FUENTE_META = {
  reposicion:    {label: 'Precio reposición (VPR)',        cls: 'esc-badge-escalado', short: 'Rep', txt: 'Reposición'},
  ultima_compra: {label: 'Última compra',                  cls: 'esc-badge-ultima',   short: 'UC',  txt: 'Última compra'},
  cambio_codigo: {label: 'Cambio de código (SGA-TR)',      cls: 'esc-badge-cambio',   short: 'CC',  txt: 'Cambio de código'},
  receta:        {label: 'Coste de receta (Mat_Formula)',  cls: 'esc-badge-receta',   short: 'Rec', txt: 'Receta'},
  pendiente:     {label: 'Pendiente (sin precio)',         cls: 'esc-badge-pendiente',short: '?',   txt: 'Pendiente'},
};
const _FUENTE_ORDER = ['reposicion','ultima_compra','cambio_codigo','receta','pendiente'];

// Agrupa las materias primas del escandallo por `precio_fuente`.
// Solo cuenta materias primas — material auxiliar queda fuera del coste amasijo.
function _calcFuentesBuckets(cod) {
  const data = escCache.get(cod);
  if (!data || !data.componentes || !data.componentes.length) return null;
  const mps = data.componentes.filter(c => c.tipo_componente !== 'material_auxiliar');
  if (!mps.length) return null;
  const buckets = {};
  let total = 0;
  for (const c of mps) {
    const f = c.precio_fuente || 'pendiente';
    if (!buckets[f]) buckets[f] = {n: 0, sum: 0};
    buckets[f].n += 1;
    if (c.coste_componente != null) {
      buckets[f].sum += c.coste_componente;
      total += c.coste_componente;
    }
  }
  return {buckets, total, n_mp: mps.length};
}

// Construye el HTML de la nota con el desglose de fuentes (versión completa).
function _buildFuentesNoteHtml(cod) {
  const info = _calcFuentesBuckets(cod);
  if (!info) return '';
  const {buckets, total} = info;

  const rows = _FUENTE_ORDER.filter(f => buckets[f]).map(f => {
    const m = _FUENTE_META[f];
    const b = buckets[f];
    const pct = total > 0 ? (b.sum / total * 100) : 0;
    const compWord = b.n === 1 ? 'componente' : 'componentes';
    const valStr = f === 'pendiente'
      ? `${b.n} ${compWord} sin precio (no suma al amasijo)`
      : `${b.n} ${compWord} · ${b.sum.toFixed(3)} € · ${pct.toFixed(1)}%`;
    return `<div class="calc-fuente-row">
      <span class="${m.cls}">${m.short}</span>
      <span class="calc-fuente-lbl">${m.label}</span>
      <span class="calc-fuente-val">${valStr}</span>
    </div>`;
  }).join('');

  const pendN = (buckets.pendiente && buckets.pendiente.n) || 0;
  const pendWarn = pendN > 0
    ? `<div class="calc-fuentes-warn">&#9888; ${pendN} componente${pendN > 1 ? 's' : ''} sin precio: el coste real podría ser superior al calculado.</div>`
    : '';

  return `<div class="calc-fuentes-note">
    <div class="calc-fuentes-title">
      <span>&#128203; Fuentes usadas en el cálculo</span>
      <span class="calc-fuentes-total">Amasijo: ${total.toFixed(3)} €</span>
    </div>
    <div class="calc-fuentes-list">${rows}</div>
    ${pendWarn}
    <div class="calc-fuentes-help">Orden de la cascada: Precio escalado &rarr; Última compra &rarr; Cambio de código (SGA-TR) &rarr; Coste de receta (Mat_Formula). El primer nivel con dato es el que se usa para cada componente.</div>
  </div>`;
}

// Construye un tooltip en texto plano (para la chip compacta de la tarjeta).
function _buildFuentesTooltip(cod) {
  const info = _calcFuentesBuckets(cod);
  if (!info) return '';
  const {buckets, total} = info;
  const lines = ['Fuentes del cálculo:'];
  for (const f of _FUENTE_ORDER) {
    if (!buckets[f]) continue;
    const b = buckets[f];
    if (f === 'pendiente') {
      lines.push(`- ${_FUENTE_META[f].txt}: ${b.n} sin precio`);
    } else {
      const pct = total > 0 ? (b.sum / total * 100) : 0;
      lines.push(`- ${_FUENTE_META[f].txt}: ${b.n} comp  (${b.sum.toFixed(2)}€  ${pct.toFixed(0)}%)`);
    }
  }
  lines.push('');
  lines.push(`Amasijo total: ${total.toFixed(2)}€`);
  return lines.join('\n');
}

async function calcularPrecio(cod, divId) {
  const inputEl  = document.getElementById(`calc-coste-${divId}`);
  const resultEl = document.getElementById(`calc-result-${divId}`);
  const btnEl    = document.getElementById(`calc-btn-${divId}`);

  // DIAGNOSTICS: guardar el último intento en window para poder inspeccionarlo
  // desde la consola del navegador con  window.__lastPrecioCall
  window.__lastPrecioCall = {cod, divId, t0: Date.now(), stage: 'start'};

  if (!resultEl) {
    console.warn('[calcularPrecio] resultEl no encontrado:', `calc-result-${divId}`);
    window.__lastPrecioCall.stage = 'no-result-el';
    return;
  }

  const costeRaw = inputEl?.value;
  const coste = parseFloat(costeRaw);
  window.__lastPrecioCall.costeRaw = costeRaw;
  window.__lastPrecioCall.coste = coste;

  if (!coste || coste <= 0 || isNaN(coste)) {
    resultEl.innerHTML = `<span style="font-size:9px;color:var(--red)">Introduce un coste válido (valor actual: ${esc(String(costeRaw))})</span>`;
    window.__lastPrecioCall.stage = 'invalid-coste';
    return;
  }

  if (btnEl) btnEl.disabled = true;
  resultEl.innerHTML = `<span style="font-size:9px;color:var(--text3)">&#8987; Calculando...</span>`;

  const payload = {endpoint: 1, codigo: cod, coste_amasijo: coste};
  window.__lastPrecioCall.payload = payload;

  let resp, rawText, d;
  try {
    resp = await fetch(`${API}/api/prices/calcular`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    window.__lastPrecioCall.httpStatus = resp.status;
    window.__lastPrecioCall.stage = 'fetch-ok';

    // Leemos como texto primero para tener diagnóstico completo incluso si no es JSON
    rawText = await resp.text();
    window.__lastPrecioCall.rawText = rawText;

    try {
      d = JSON.parse(rawText);
    } catch (pe) {
      console.error('[calcularPrecio] respuesta no-JSON HTTP', resp.status, rawText.slice(0, 500));
      resultEl.innerHTML = `<span style="font-size:9px;color:var(--red)">Respuesta no válida del servidor (HTTP ${resp.status}). Revisa consola.</span>`;
      window.__lastPrecioCall.stage = 'not-json';
      return;
    }
    window.__lastPrecioCall.responseBody = d;

    if (!resp.ok && !d) {
      resultEl.innerHTML = `<span style="font-size:9px;color:var(--red)">HTTP ${resp.status}</span>`;
      window.__lastPrecioCall.stage = 'http-error-no-body';
      return;
    }

    if (!d.ok) {
      const errMsg = d.error || d.message || `HTTP ${resp.status}`;
      console.warn('[calcularPrecio] motor devolvió error:', errMsg, d);
      resultEl.innerHTML = `<span style="font-size:9px;color:var(--red)">
        ${esc(errMsg)}</span>`;
      window.__lastPrecioCall.stage = 'motor-error';
      return;
    }

    const f2  = v => v != null ? parseFloat(v).toFixed(2) + '\u00a0€' : '—';
    const f3  = v => v != null ? parseFloat(v).toFixed(3) + '\u00a0€' : '—';
    const fp  = v => v != null ? parseFloat(v).toFixed(1) + '\u00a0%' : '—';

    const escalados = [
      {label:'3.000 uds', key:'escalado3000'},
      {label:'5.000 uds', key:'escalado5000'},
      {label:'25.000 uds', key:'escalado25000'},
      {label:'50.000 uds', key:'escalado50000'},
    ].filter(e => d[e.key] != null && parseFloat(d[e.key]) > 0)
     .map(e => `<div class="calc-esc-chip"><span>${esc(e.label)}</span>${f3(d[e.key])}</div>`)
     .join('');

    const fuentesNote = _buildFuentesNoteHtml(cod);

    resultEl.innerHTML = `
      <div class="calc-result-grid">
        <div class="calc-kpi"><span class="lbl">Precio / Pack</span><span class="val hl">${f2(d.precioVentaPack)}</span></div>
        <div class="calc-kpi"><span class="lbl">Precio / kg prod</span><span class="val">${f2(d.precio1kgProd)}</span></div>
        <div class="calc-kpi"><span class="lbl">Precio / ud</span><span class="val">${f3(d.precio1bargel)}</span></div>
        <div class="calc-kpi"><span class="lbl">Beneficio</span><span class="val">${fp(d.beneficio)}</span></div>
        <div class="calc-kpi"><span class="lbl">Margen coste</span><span class="val">${fp(d.margenCosto)}</span></div>
      </div>
      ${escalados ? `<div class="calc-escalados">${escalados}</div>` : ''}
      ${fuentesNote}`;
    window.__lastPrecioCall.stage = 'rendered';
    window.__lastPrecioCall.precioVentaPack = d.precioVentaPack;
    console.info('[calcularPrecio] OK', cod, 'pack=', d.precioVentaPack, '€');
  } catch(e) {
    console.error('[calcularPrecio] excepción:', e, 'resp=', resp, 'rawText=', rawText);
    resultEl.innerHTML = `<span style="font-size:9px;color:var(--red)">Sin conexión con el motor de precios (${esc(e.message || String(e))})</span>`;
    window.__lastPrecioCall.stage = 'exception';
    window.__lastPrecioCall.exception = String(e);
  } finally {
    if (btnEl) btnEl.disabled = false;
    window.__lastPrecioCall.t1 = Date.now();
  }
}

async function calcularPrecioInline(cod, safeId, costeDefault) {
  const spanEl = document.getElementById(`calc-inline-${safeId}`);
  if (!spanEl) return;
  spanEl.textContent = '⏳';
  try {
    const resp = await fetch(`${API}/api/prices/calcular`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({endpoint: 1, codigo: cod, coste_amasijo: costeDefault})
    });
    const rawText = await resp.text();
    let d;
    try { d = JSON.parse(rawText); } catch { d = null; }

    if (d && d.ok && d.precioVentaPack != null) {
      spanEl.textContent = parseFloat(d.precioVentaPack).toFixed(2) + ' €/pack';
      // Tooltip con el desglose de fuentes (pasa el ratón por encima
      // de la chip para ver qué se usó en el cálculo).
      const tip = _buildFuentesTooltip(cod);
      if (tip) spanEl.title = tip;
    } else if (d && d.error) {
      spanEl.textContent = esc(d.error).slice(0, 40);
    } else {
      console.warn('[calcularPrecioInline] respuesta rara HTTP', resp.status, rawText.slice(0, 300));
      spanEl.textContent = `HTTP ${resp.status}`;
    }
  } catch(e) {
    console.error('[calcularPrecioInline] error:', e);
    spanEl.textContent = 'error';
  }
}

// ─── UTILITIES ────────────────────────────────────────────────────
function esc(s) {
  if (s == null) return '';
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

function fmtN(v) {
  if (v == null || v === '' || v === '0E-10') return '—';
  const n = Number(v);
  if (isNaN(n) || n === 0) return '0';
  return n >= 100 ? Math.round(n).toLocaleString() : n.toFixed(1);
}

function highlightText(escapedHtml, query) {
  if (!query) return escapedHtml;
  const words = query.split(/\s+/).filter(w => w.length >= 2);
  let result = escapedHtml;
  for (const word of words) {
    const escaped = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const regex = new RegExp(`(${escaped})`, 'gi');
    result = result.replace(regex, '<mark>$1</mark>');
  }
  return result;
}

function onWeightSlider(dim, val) {
  val = parseInt(val, 10);
  if (!simCustomWeights) {
    simCustomWeights = {...(simDefaultWeights || {})};
  }
  simCustomWeights[dim] = val;
  // Update display
  const valEl = document.getElementById('wval-' + dim);
  if (valEl) valEl.textContent = val;
  const total = SIM_DIM_ORDER.reduce((s, d) => s + Math.round(simCustomWeights[d] || 0), 0);
  const totalEl = document.getElementById('weights-total');
  if (totalEl) {
    totalEl.textContent = total;
    totalEl.style.color = (total >= 95 && total <= 105) ? 'var(--green)' : 'var(--orange)';
  }
  clearTimeout(simDebounce);
  simDebounce = setTimeout(doSimilarSearch, 600);

async function doSimilarSearch() {
  if (!simRefCod) return;
  const cnt = document.getElementById('content-area');
  const t0 = performance.now();
  cnt.innerHTML = `<div class="loading"><div class="spinner"></div><div class="loading-text">Buscando similares...</div></div>`;

  const params = new URLSearchParams();
  if (simExcluded.size) params.set('exclude', [...simExcluded].join(','));
  if (simType) params.set('product_type', simType);
  params.set('limit', '25');
  if (simCustomWeights) {
    params.set('weights', JSON.stringify(simCustomWeights));
  }

  try {
    const data = await fetch(`${API}/api/similar/${encodeURIComponent(simRefCod)}?${params}`).then(r => r.json());
    if (data.error) throw new Error(data.error);
    simResults = data;
    renderSimPanel();
    renderSimilarityResults(data, Math.round(performance.now() - t0));

    cnt.innerHTML = `<div class="empty"><div class="empty-icon">&#9888;&#65039;</div><div class="empty-title">Error</div><div class="empty-desc">${esc(e.message)}</div></div>`;

/* ── Build the full comparison view for a candidate ────────────────── */
function buildComparePanel(r, refData) {
  const cd = r.comparison_data;
  if (!cd || !Object.keys(cd).length) return '';

  const conf = Math.round((r.confidence || 0) * 100);
  const confCls = conf >= 70 ? 'sim-conf-hi' : conf >= 45 ? 'sim-conf-md' : 'sim-conf-lo';
  const pct = Math.round((r.score || 0) * 100);
  const epct = Math.round((r.effective_score || 0) * 100);

  let html = `<div class="sim-compare">`;
  // Header
  html += `<div class="sim-compare-hdr">
    <div class="sim-compare-title">Comparativa: ${esc(refData.cod)} vs ${esc(r.cod)}</div>
    <div class="sim-compare-scores">
      <span class="sim-score-badge" style="background:${pct>=70?'#15803d':pct>=45?'#336699':'#b45309'};font-size:9px;">${pct}%</span>
      <span class="sim-conf-badge ${confCls}" title="Confianza: porcentaje del perfil que se pudo comparar realmente">&#128202; ${conf}%</span>
    </div>
  </div>`;

  // Column headers
  html += `<div class="sim-compare-cols hdr-row">
    <div>Dimension</div><div>Referencia</div><div>Candidato</div><div>Sim</div>
  </div>`;

  // Each dimension
  for (const dim of SIM_DIM_ORDER) {
    const info = cd[dim];
    if (!info) continue;

    const sim = info.sim;
    const simPct = sim != null ? Math.round(sim * 100) : null;
    const verdict = info.verdict || 'no_data';
    const vpillCls = 'sim-vpill sim-vpill-' + verdict;
    const dimLabel = SIM_DIM_LABELS[dim] || dim;
    const dimIcon = SIM_DIM_ICONS[dim] || '';

    let refCell = '', candCell = '';

    if (dim === 'category' || dim === 'subcategory' || dim === 'protein_source' || dim === 'coating') {
      refCell = esc(info.ref_value || '—');
      candCell = esc(info.cand_value || '—');
    } else if (dim === 'flavor') {
      const rv = info.ref_value;
      const cv = info.cand_value;
      refCell = rv && rv.length ? rv.map(f => esc(f)).join(', ') : '<span style="color:var(--text3)">—</span>';
      candCell = cv && cv.length ? cv.map(f => {
        const isCommon = (info.common||[]).includes(f);
        return isCommon ? `<b style="color:var(--green)">${esc(f)}</b>` : esc(f);
      }).join(', ') : '<span style="color:var(--text3)">—</span>';
    } else if (dim === 'macros') {
      refCell = buildMacroBars(info.fields, 'ref', refData);
      candCell = buildMacroBars(info.fields, 'cand', r);
    } else if (dim === 'allergens') {
      refCell = buildAllergenCell(info.ref_contains, info.ref_traces);
      candCell = buildAllergenCell(info.cand_contains, info.cand_traces);
    } else if (dim === 'description') {
      const tokens = info.common_tokens || [];
      refCell = `<span style="font-size:8px;color:var(--text3)">${esc((info.ref_value||'').substring(0, 60))}${(info.ref_value||'').length > 60 ? '...' : ''}</span>`;
      candCell = tokens.length
        ? tokens.slice(0, 8).map(t => `<span class="sim-token-common">${esc(t)}</span>`).join(' ')
        : `<span style="font-size:8px;color:var(--text3)">${esc((info.cand_value||'').substring(0, 60))}${(info.cand_value||'').length > 60 ? '...' : ''}</span>`;
    }

    const simCell = simPct != null
      ? `<span class="${vpillCls}">${simPct}%</span>`
      : `<span class="sim-vpill sim-vpill-no_data">—</span>`;

    html += `<div class="sim-compare-cols">
      <div><span class="dim-icon">${dimIcon}</span><span class="dim-label">${esc(dimLabel)}</span></div>
      <div>${refCell}</div>
      <div>${candCell}</div>
      <div>${simCell}</div>
    </div>`;

    // Explanation row
    if (info.explanation) {
      html += `<div class="sim-explain-row"><b>${esc(dimLabel)}:</b> ${esc(info.explanation)}</div>`;
    }
  }

  // Summary footer
  const explanations = SIM_DIM_ORDER
    .filter(d => cd[d]?.explanation && cd[d]?.comparable)
    .map(d => cd[d].explanation);
  if (explanations.length > 0) {
    const nonCompDims = SIM_DIM_ORDER.filter(d => cd[d] && !cd[d].comparable);
    let footer = '';
    if (nonCompDims.length > 0) {
      const names = nonCompDims.map(d => SIM_DIM_LABELS[d] || d).join(', ');
      footer = `<div style="margin-top:4px;font-size:8px;color:var(--orange)">Sin datos comparables en: ${esc(names)} &mdash; peso redistribuido a las dimensiones con datos.</div>`;
    }
    html += `<div class="sim-explain-row" style="background:var(--bg3);border-top:2px solid var(--border2);">
      <div style="font-size:8px;font-weight:700;color:var(--text2);margin-bottom:3px;text-transform:uppercase;letter-spacing:0.06em;">Resumen</div>
      <div>Similitud bruta: <b>${pct}%</b> &middot; Confianza del perfil: <b>${conf}%</b> &middot; Puntuacion efectiva: <b>${epct}%</b></div>
      ${footer}
    </div>`;
  }

  // Price history charts — enriched with cost line, margin shading, escalados
  const phId = Math.random().toString(36).slice(2, 10);
  html += `<div class="sim-price-history">
    <div class="sim-price-title">Historico de precios</div>
    <div class="sim-price-row">
      <div>
        <div style="font-size:9px;font-weight:600;color:var(--text2);margin-bottom:4px;">${esc(refData.cod)} (Ref.)</div>
        <div style="position:relative;height:200px;">
          <canvas class="ph-canvas" id="ph-ref-${phId}" data-cod="${esc(refData.cod)}"></canvas>
        </div>
        <div id="ph-meta-ref-${phId}" class="ph-meta"></div>
      </div>
      <div>
        <div style="font-size:9px;font-weight:600;color:var(--text2);margin-bottom:4px;">${esc(r.cod)} (Candidato)</div>
        <div style="position:relative;height:200px;">
          <canvas class="ph-canvas" id="ph-cand-${phId}" data-cod="${esc(r.cod)}"></canvas>
        </div>
        <div id="ph-meta-cand-${phId}" class="ph-meta"></div>
      </div>
    </div>
  </div>`;

  html += `</div>`;
  return html;
}

function buildMacroBars(fields, side, product) {
  if (!fields) return '<span style="color:var(--text3)">—</span>';
  const macroOrder = ['proteina','grasas','grasas_sat','carbos','azucares','fibra','sodio'];
  // Find max for scaling bars
  let maxVal = 0;
  for (const f of macroOrder) {
    const fd = fields[f];
    if (fd) {
      if (fd.ref != null && fd.ref > maxVal) maxVal = fd.ref;
      if (fd.cand != null && fd.cand > maxVal) maxVal = fd.cand;
    }
  }
  if (maxVal <= 0) maxVal = 100;

  let html = '<div class="sim-macro-bars">';
  for (const f of macroOrder) {
    const fd = fields[f];
    if (!fd) continue;
    const val = fd[side];
    const hasData = fd[side + '_has_data'] !== false && val != null;
    if (!hasData) continue;

    const label = MACRO_LABELS_SIM[f] || f;
    const unit = f === 'sodio' ? 'mg' : 'g';
    const barW = Math.max(2, Math.round((val / maxVal) * 100));
    const barCls = side === 'ref' ? 'sim-macro-bar-ref' : 'sim-macro-bar-cand';
    const valCls = side === 'ref' ? 'sim-macro-val-ref' : 'sim-macro-val-cand';

    // Show diff percentage on candidate side
    let diffTag = '';
    if (side === 'cand' && fd.diff_pct != null) {
      const dp = fd.diff_pct;
      const dc = Math.abs(dp) <= 10 ? 'var(--green)' : Math.abs(dp) <= 30 ? 'var(--blue)' : 'var(--orange)';
      diffTag = ` <span style="font-size:6px;color:${dc}">${dp > 0 ? '+' : ''}${dp}%</span>`;
    }

    html += `<div style="display:flex;align-items:center;gap:3px;font-size:7px;">
      <span style="width:48px;text-align:right;color:var(--text3);font-weight:600;flex-shrink:0;">${esc(label)}</span>
      <div style="flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden;">
        <div class="sim-macro-bar ${barCls}" style="width:${barW}%;"></div>
      </div>
      <span class="sim-macro-val ${valCls}" style="width:40px;">${fmtN(val)}${unit}${diffTag}</span>
    </div>`;
  }
  html += '</div>';
  return html;
}

function buildAllergenCell(contains, traces) {
  if ((!contains || !contains.length) && (!traces || !traces.length)) {
    return '<span style="font-size:8px;color:var(--text3)">Ninguno</span>';
  }
  let html = '<div class="sim-allergen-list">';
  if (contains && contains.length) {
    contains.forEach(a => { html += `<span class="sim-allergen-chip sim-allergen-contains">${esc(a)}</span>`; });
  }
  if (traces && traces.length) {
    traces.forEach(a => { html += `<span class="sim-allergen-chip sim-allergen-traces" title="Trazas">${esc(a)}*</span>`; });
  }
  html += '</div>';
  return html;
}

// ─── SCATTER CHART (Phase 3: configurable axes) ──────────────────
let scatterChartInstance = null;
let scatterPriceData = null;   // cached API response
let scatterRefCod = null;
let scatterResults = null;

const SCATTER_AXIS_LABELS = {
  similitud: 'Similitud (%)',
  precio1kgProd: 'Precio EUR/kg',
  precioVentaPack: 'Precio EUR/pack',
  costo1kgmasa: 'Coste masa EUR/kg',
  margenCostoPorc: 'Margen (%)',
  beneficio: 'Beneficio (EUR)',
  confianza: 'Confianza (%)',
  peso_grs: 'Peso (g)',
};

const SCATTER_COLOR_PALETTES = {
  tipo: {LB: '#0524de', K: '#d97706'},
  margen_rango: {alto: '#16a34a', medio: '#d97706', bajo: '#dc2626', sin_dato: '#aaa'},
};

function getScatterVal(dim, result, priceRow) {
  if (dim === 'similitud') return Math.round((result.effective_score || result.score || 0) * 100);
  if (dim === 'confianza') return Math.round((result.confidence || 0) * 100);
  if (priceRow) {
    if (dim === 'precio1kgProd') return priceRow.precio1kgProd || 0;
    if (dim === 'precioVentaPack') return priceRow.precioVentaPack || 0;
    if (dim === 'costo1kgmasa') return priceRow.costo1kgmasa || 0;
    if (dim === 'margenCostoPorc') return priceRow.margenCostoPorc || 0;
    if (dim === 'beneficio') return priceRow.beneficio || 0;
    if (dim === 'peso_grs') return priceRow.peso_grs || 0;
  }
  return 0;
}

function getScatterColor(colorDim, result, priceRow) {
  if (colorDim === 'tipo') return result.is_k ? SCATTER_COLOR_PALETTES.tipo.K : SCATTER_COLOR_PALETTES.tipo.LB;
  if (colorDim === 'categoria') {
    // Hash category name to a hue
    const cat = result.category || '';
    let h = 0; for (let i = 0; i < cat.length; i++) h = cat.charCodeAt(i) + ((h << 5) - h);
    return `hsl(${Math.abs(h) % 360}, 60%, 50%)`;
  }
  if (colorDim === 'margen_rango') {
    const m = priceRow ? (priceRow.margenCostoPorc || 0) : 0;
    if (m === 0) return SCATTER_COLOR_PALETTES.margen_rango.sin_dato;
    if (m >= 15) return SCATTER_COLOR_PALETTES.margen_rango.alto;
    if (m >= 5) return SCATTER_COLOR_PALETTES.margen_rango.medio;
    return SCATTER_COLOR_PALETTES.margen_rango.bajo;
  }
  if (colorDim === 'cliente') {
    const cli = priceRow ? (priceRow.nombre_cliente || '') : '';
    let h = 0; for (let i = 0; i < cli.length; i++) h = cli.charCodeAt(i) + ((h << 5) - h);
    return `hsl(${Math.abs(h) % 360}, 55%, 48%)`;
  }
  return '#0524de';
}

function getScatterColorLabel(colorDim, result, priceRow) {
  if (colorDim === 'tipo') return result.is_k ? 'K' : 'LB';
  if (colorDim === 'categoria') return result.category || 'Sin cat.';
  if (colorDim === 'margen_rango') {
    const m = priceRow ? (priceRow.margenCostoPorc || 0) : 0;
    if (m === 0) return 'Sin dato';
    if (m >= 15) return 'Margen alto (≥15%)';
    if (m >= 5) return 'Margen medio (5-15%)';
    return 'Margen bajo (<5%)';
  }
  if (colorDim === 'cliente') return priceRow ? (priceRow.nombre_cliente || 'Sin cliente') : 'Sin cliente';
  return '';
}

async function loadScatterChart(refCod, results) {
  const box = document.getElementById('scatter-box');
  const wrap = document.getElementById('scatter-wrap');
  if (!box || !wrap || typeof Chart === 'undefined') return;

  scatterRefCod = refCod;
  scatterResults = results;

  const allCodes = [refCod, ...results.map(r => r.cod)].filter(Boolean);
  if (!allCodes.length) { wrap.style.display = 'none'; return; }

  try {
    const resp = await fetch(`${API}/api/prices/scatter?codes=${allCodes.map(encodeURIComponent).join(',')}`);
    const data = await resp.json();

    if (data.error || !data.prices) {
      wrap.style.display = 'none';
      return;
    }

    scatterPriceData = data.prices;
    replotScatter();
  } catch (e) {
    console.warn('Scatter chart error:', e);
    if (wrap) wrap.style.display = 'none';
  }
}

function replotScatter() {
  const box = document.getElementById('scatter-box');
  const wrap = document.getElementById('scatter-wrap');
  const legendDiv = document.getElementById('scatter-legend');
  if (!box || !wrap || !scatterPriceData || !scatterRefCod || typeof Chart === 'undefined') return;

  const xDim = document.getElementById('scatter-x')?.value || 'similitud';
  const yDim = document.getElementById('scatter-y')?.value || 'precio1kgProd';
  const sizeDim = document.getElementById('scatter-size')?.value || 'none';
  const colorDim = document.getElementById('scatter-color')?.value || 'tipo';

  const prices = scatterPriceData;
  const results = scatterResults || [];

  // Build unified list: ref (100% sim, 100% conf) + candidates
  const refResult = {cod: scatterRefCod, score: 1, effective_score: 1, confidence: 1, is_k: scatterRefCod.startsWith('K'), category: '', isRef: true};
  const allItems = [refResult, ...results];

  // Collect all size values for normalization
  const sizeVals = sizeDim !== 'none' ? allItems.map(r => getScatterVal(sizeDim, r, prices[r.cod])).filter(v => v > 0) : [];
  const sizeMin = sizeVals.length ? Math.min(...sizeVals) : 0;
  const sizeMax = sizeVals.length ? Math.max(...sizeVals) : 1;
  const sizeRange = sizeMax - sizeMin || 1;

  // Group by color label for legend
  const colorGroups = new Map();

  const points = [];
  allItems.forEach(r => {
    const p = prices[r.cod];
    const xVal = getScatterVal(xDim, r, p);
    const yVal = getScatterVal(yDim, r, p);
    if (xVal === 0 && yVal === 0) return;

    let radius = 5;
    if (sizeDim !== 'none') {
      const sv = getScatterVal(sizeDim, r, p);
      radius = sv > 0 ? 4 + ((sv - sizeMin) / sizeRange) * 16 : 3;
    }
    if (r.isRef) radius = Math.max(radius, 9);

    const color = getScatterColor(colorDim, r, p);
    const clabel = getScatterColorLabel(colorDim, r, p);
    if (!colorGroups.has(clabel)) colorGroups.set(clabel, color);

    points.push({
      x: xVal, y: yVal, r: radius,
      cod: r.cod, desc: r.desc || r.cod, isRef: !!r.isRef,
      bgColor: r.isRef ? color : (color.startsWith('#') ? color + '80' : color.replace(')', ',0.5)').replace('hsl', 'hsla').replace('rgb', 'rgba')),
      borderColor: color,
      clabel,
    });
  });

  if (points.length === 0) {
    wrap.style.display = 'none';
    return;
  }

  // Destroy previous and recreate canvas sized to container
  if (scatterChartInstance) { scatterChartInstance.destroy(); scatterChartInstance = null; }
  const boxW = box.clientWidth || box.offsetWidth || 800;
  const boxH = box.clientHeight || box.offsetHeight || 420;
  box.innerHTML = `<canvas id="scatter-chart" width="${boxW}" height="${boxH}"></canvas>`;
  const canvas = document.getElementById('scatter-chart');

  // Use bubble chart for variable radius
  scatterChartInstance = new Chart(canvas, {
    type: 'bubble',
    data: {
      datasets: [{
        data: points.map(pt => ({x: pt.x, y: pt.y, r: pt.r, _meta: pt})),
        backgroundColor: points.map(pt => pt.bgColor),
        borderColor: points.map(pt => pt.borderColor),
        borderWidth: points.map(pt => pt.isRef ? 2.5 : 1),
        pointStyle: points.map(pt => pt.isRef ? 'star' : 'circle'),
        hoverRadius: 4,
      }],
    },
    options: {
      animation: false,
      responsive: false,
      plugins: {
        legend: {display: false},
        tooltip: {
          backgroundColor: 'rgba(30,40,60,0.92)',
          titleFont: {family: "'Open Sans'", size: 11, weight: '700'},
          bodyFont: {family: "'Open Sans'", size: 10},
          padding: 10,
          cornerRadius: 6,
          callbacks: {
            title: function(items) {
              const m = items[0]?.raw?._meta;
              return m ? `${m.cod}${m.isRef ? '  ★ REFERENCIA' : ''}` : '';
            },
            label: function(ctx) {
              const m = ctx.raw._meta;
              const xLabel = SCATTER_AXIS_LABELS[xDim] || xDim;
              const yLabel = SCATTER_AXIS_LABELS[yDim] || yDim;
              const lines = [];
              lines.push(`${xLabel}: ${typeof m.x === 'number' ? m.x.toFixed(2) : m.x}`);
              lines.push(`${yLabel}: ${typeof m.y === 'number' ? m.y.toFixed(2) : m.y}`);
              if (m.clabel) lines.push(`↳ ${m.clabel}`);
              return lines;
            }
          },
        },
      },
      scales: {
        x: {
          title: {display: true, text: SCATTER_AXIS_LABELS[xDim] || xDim, font: {family: "'Open Sans'", size: 12, weight: '600'}, color: '#374151'},
          grid: {color: '#eef0f4', lineWidth: 1},
          ticks: {font: {size: 10, family: "'Open Sans'"}, color: '#6b7280'},
          border: {color: '#d1d5db'},
        },
        y: {
          title: {display: true, text: SCATTER_AXIS_LABELS[yDim] || yDim, font: {family: "'Open Sans'", size: 12, weight: '600'}, color: '#374151'},
          grid: {color: '#eef0f4', lineWidth: 1},
          ticks: {font: {size: 10, family: "'Open Sans'"}, color: '#6b7280'},
          border: {color: '#d1d5db'},
        },
      },
    },
  });

  // Build inline legend from color groups
  if (legendDiv) {
    let lhtml = '';
    colorGroups.forEach((color, label) => {
      lhtml += `<span class="scatter-legend-item"><span class="scatter-legend-dot" style="background:${color}"></span>${esc(label)}</span>`;
    });
    legendDiv.innerHTML = lhtml;
  }
}

// ─── PRICE HISTORY CHART (enriched) ──────────────────────────────
const priceHistoryCache = new Map();
let priceChartInstances = {};

async function loadPriceHistory(cod, canvasId) {
  const canvas = document.getElementById(canvasId);
  if (!canvas || typeof Chart === 'undefined') return;

  try {
    let data;
    if (priceHistoryCache.has(cod)) {
      data = priceHistoryCache.get(cod);
    } else {
      data = await fetch(`${API}/api/prices/history/${encodeURIComponent(cod)}`).then(r => r.json());
      priceHistoryCache.set(cod, data);
    }

    if (data.error || !data.history || data.history.length === 0) {
      canvas.parentElement.innerHTML = '<div style="font-size:9px;color:var(--text3);padding:8px;">Sin historial de precios</div>';
      return;
    }

    const history = data.history;
    const labels = history.map(h => h.fecha || '');
    const precioKg = history.map(h => h.precio1kgProd || 0);
    const costoKg  = history.map(h => h.costo1kgmasa || 0);
    const hasCost  = costoKg.some(v => v > 0);

    // Margin fill: build array of background colors per segment
    // green when margin > 15%, yellow 5-15%, red < 5%
    const marginColors = history.map(h => {
      const m = h.margenCostoPorc || 0;
      if (m >= 15) return 'rgba(22,163,74,0.12)';
      if (m >= 5)  return 'rgba(217,119,6,0.10)';
      return 'rgba(220,38,38,0.10)';
    });

    // Destroy previous chart and recreate canvas cleanly
    if (priceChartInstances[canvasId]) { priceChartInstances[canvasId].destroy(); delete priceChartInstances[canvasId]; }
    const parent = canvas.parentElement;
    const newCanvas = document.createElement('canvas');
    newCanvas.id = canvasId;
    parent.replaceChild(newCanvas, canvas);

    const datasets = [
      {
        label: 'Precio EUR/kg',
        data: precioKg,
        borderColor: '#0524de',
        backgroundColor: 'rgba(5,36,222,0.06)',
        fill: hasCost ? '+1' : true,  // fill down to cost line if available
        tension: 0.3,
        pointRadius: 2,
        borderWidth: 2,
        order: 1,
      },
    ];

    if (hasCost) {
      datasets.push({
        label: 'Coste masa EUR/kg',
        data: costoKg,
        borderColor: '#dc2626',
        borderDash: [5, 3],
        backgroundColor: 'transparent',
        fill: false,
        tension: 0.3,
        pointRadius: 1.5,
        borderWidth: 1.5,
        order: 2,
      });
    }

    // Custom filler plugin for margin-colored area between price and cost
    const marginFillPlugin = hasCost ? {
      id: 'marginFill_' + canvasId,
      beforeDatasetsDraw(chart) {
        const meta0 = chart.getDatasetMeta(0);
        const meta1 = chart.getDatasetMeta(1);
        if (!meta0.data.length || !meta1.data.length) return;
        const ctx = chart.ctx;
        for (let i = 0; i < meta0.data.length - 1; i++) {
          const p0top = meta0.data[i], p1top = meta0.data[i+1];
          const p0bot = meta1.data[i], p1bot = meta1.data[i+1];
          if (!p0top || !p1top || !p0bot || !p1bot) continue;
          ctx.save();
          ctx.beginPath();
          ctx.moveTo(p0top.x, p0top.y);
          ctx.lineTo(p1top.x, p1top.y);
          ctx.lineTo(p1bot.x, p1bot.y);
          ctx.lineTo(p0bot.x, p0bot.y);
          ctx.closePath();
          ctx.fillStyle = marginColors[i];
          ctx.fill();
          ctx.restore();
        }
      }
    } : null;

    priceChartInstances[canvasId] = new Chart(newCanvas, {
      type: 'line',
      data: { labels, datasets },
      options: {
        animation: false,
        responsive: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: {position: 'top', labels: {font: {family: "'Open Sans'", size: 8}, usePointStyle: true, pointStyle: 'circle', boxWidth: 6}},
          tooltip: {
            callbacks: {
              afterBody: function(items) {
                const idx = items[0]?.dataIndex;
                if (idx == null) return '';
                const h = history[idx];
                const lines = [];
                if (h.nombre_cliente) lines.push('Cliente: ' + h.nombre_cliente);
                if (h.margenCostoPorc) lines.push('Margen: ' + h.margenCostoPorc.toFixed(1) + '%');
                if (h.precioVentaPack) lines.push('Pack: ' + h.precioVentaPack.toFixed(2) + ' EUR');
                if (h.fecha_entrada_vigor) lines.push('Vigor: ' + h.fecha_entrada_vigor + (h.fecha_fin_vigor ? ' → ' + h.fecha_fin_vigor : ''));
                return lines;
              }
            },
            titleFont: {family: "'Open Sans'", size: 9},
            bodyFont: {family: "'Open Sans'", size: 8},
          },
        },
        scales: {
          x: {ticks: {font: {size: 7}, maxRotation: 45, maxTicksLimit: 12}, grid: {color: '#e5e7eb'}},
          y: {beginAtZero: false, ticks: {font: {size: 8}}, grid: {color: '#e5e7eb'}},
        },
      },
      plugins: marginFillPlugin ? [marginFillPlugin] : [],
    });

    // Render meta info (escalados, latest client, vigencia) below the chart
    const metaDiv = document.getElementById(canvasId.replace('ph-ref-', 'ph-meta-ref-').replace('ph-cand-', 'ph-meta-cand-'));
    if (metaDiv && history.length > 0) {
      const latest = history[history.length - 1];
      let metaHtml = '';
      if (latest.nombre_cliente) metaHtml += `<b>Cliente:</b> ${esc(latest.nombre_cliente)} &nbsp;`;
      if (latest.margenCostoPorc) metaHtml += `<b>Margen:</b> ${latest.margenCostoPorc.toFixed(1)}% &nbsp;`;
      if (latest.beneficio) metaHtml += `<b>Beneficio:</b> ${latest.beneficio.toFixed(2)} EUR &nbsp;`;
      if (latest.fecha_entrada_vigor) metaHtml += `<br><b>Vigencia:</b> ${latest.fecha_entrada_vigor}${latest.fecha_fin_vigor ? ' → ' + latest.fecha_fin_vigor : ' (vigente)'}`;

      // Escalados (volume pricing)
      const esc3  = latest.escalado3000  || 0;
      const esc5  = latest.escalado5000  || 0;
      const esc25 = latest.escalado25000 || 0;
      const esc50 = latest.escalado50000 || 0;
      if (esc3 || esc5 || esc25 || esc50) {
        metaHtml += `<div class="ph-escalados">`;
        if (esc3)  metaHtml += `<span class="ph-esc-chip">3K: ${esc3.toFixed(2)}</span>`;
        if (esc5)  metaHtml += `<span class="ph-esc-chip">5K: ${esc5.toFixed(2)}</span>`;
        if (esc25) metaHtml += `<span class="ph-esc-chip">25K: ${esc25.toFixed(2)}</span>`;
        if (esc50) metaHtml += `<span class="ph-esc-chip">50K: ${esc50.toFixed(2)}</span>`;
        metaHtml += `</div>`;
      }
      metaDiv.innerHTML = metaHtml;
    }
  } catch (e) {
    console.warn('Price history error for', cod, e);
  }
}

// ─── START ────────────────────────────────────────────────────────
init();

// ─── DEV LIVE RELOAD ──────────────────────────────────────────────
(function() {
  let lastMtime = null;
  async function checkReload() {
    try {
      const r = await fetch(`${API}/api/dev/mtime`);
      const d = await r.json();
      if (lastMtime === null) { lastMtime = d.mtime; return; }
      if (d.mtime !== lastMtime) location.reload();
    } catch {}
  }
  setInterval(checkReload, 1500);
})();
</script>
